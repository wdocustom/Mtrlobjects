<!--
  MRTL Render — Image-to-Image AI Tool
  =====================================
  Squarespace-ready embed. Paste this entire block into a
  Squarespace "Code Block" (Insert > Code). Everything is
  scoped under .mrtl-render so it won't leak into or inherit
  from your Squarespace theme styles.
-->

<style>
  /* ==============================================
     FONT IMPORT (inline — no <link> tags needed)
     ============================================== */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  /* ==============================================
     SCOPED CSS VARIABLES
     All custom properties live on the wrapper so
     they never collide with Squarespace :root vars.
     ============================================== */
  .mrtl-render {
    /* Palette */
    --mr-bg:           #0e0e10;
    --mr-surface:      #18181c;
    --mr-surface-alt:  #222228;
    --mr-border:       #2e2e36;
    --mr-text:         #e8e8ec;
    --mr-text-muted:   #8a8a96;
    --mr-accent:       #7b61ff;
    --mr-accent-glow:  rgba(123, 97, 255, .25);
    --mr-danger:       #ff6b6b;
    --mr-success:      #34d399;

    /* Typography */
    --mr-font-body:    'Space Grotesk', system-ui, sans-serif;
    --mr-font-mono:    'Space Mono', ui-monospace, monospace;

    /* Radii */
    --mr-radius-sm:    8px;
    --mr-radius-md:    14px;
    --mr-radius-lg:    20px;
  }

  /* ==============================================
     SCOPED RESET
     Only resets elements INSIDE the widget wrapper
     so Squarespace page styles stay intact.
     ============================================== */
  .mrtl-render *,
  .mrtl-render *::before,
  .mrtl-render *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* ==============================================
     WRAPPER / CONTAINER
     ============================================== */
  .mrtl-render {
    font-family: var(--mr-font-body);
    color: var(--mr-text);
    line-height: 1.6;
    background: var(--mr-bg);
    border-radius: var(--mr-radius-lg);
    padding: 2.5rem 1.5rem;
    max-width: 1120px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  .mrtl-render img {
    display: block;
    max-width: 100%;
  }

  .mrtl-render button {
    cursor: pointer;
    font-family: inherit;
  }

  /* ==============================================
     PAGE HEADER
     ============================================== */
  .mr-header {
    text-align: center;
    margin-bottom: 2.5rem;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .mr-header__logo {
    font-family: var(--mr-font-mono);
    font-size: .75rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--mr-accent);
    margin-bottom: .5rem;
  }

  .mr-header__title {
    font-family: var(--mr-font-body);
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.15;
    color: var(--mr-text);
  }

  .mr-header__subtitle {
    font-family: var(--mr-font-body);
    font-size: .95rem;
    color: var(--mr-text-muted);
    margin-top: .5rem;
    font-weight: 400;
  }

  /* ==============================================
     MAIN CARD (two-column grid)
     ============================================== */
  .mr-card {
    background: var(--mr-surface);
    border-radius: var(--mr-radius-lg);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }

  .mr-card__section {
    padding: 2rem;
  }

  .mr-card__section--input {
    border-right: 1px solid var(--mr-border);
  }

  .mr-section-label {
    font-family: var(--mr-font-mono);
    font-size: .7rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--mr-text-muted);
    margin-bottom: 1.25rem;
  }

  /* ==============================================
     UPLOAD / DROP ZONE
     ============================================== */
  .mr-upload {
    position: relative;
    border: 2px dashed var(--mr-border);
    border-radius: var(--mr-radius-md);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    transition: border-color .2s, background .2s;
    cursor: pointer;
    overflow: hidden;
  }

  .mr-upload:hover,
  .mr-upload--dragover {
    border-color: var(--mr-accent);
    background: var(--mr-accent-glow);
  }

  .mr-upload--has-image {
    border-style: solid;
    border-color: var(--mr-border);
    cursor: default;
  }

  .mr-upload--has-image:hover {
    background: transparent;
    border-color: var(--mr-border);
  }

  /* Native file input covers the entire zone */
  .mr-upload__input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    font-size: 0;
  }

  .mr-upload--has-image .mr-upload__input {
    display: none;
  }

  .mr-upload__icon {
    width: 48px;
    height: 48px;
    color: var(--mr-text-muted);
  }

  .mr-upload__text {
    font-size: .9rem;
    color: var(--mr-text-muted);
    text-align: center;
  }

  .mr-upload__text strong {
    color: var(--mr-accent);
  }

  .mr-upload__hint {
    font-size: .75rem;
    color: var(--mr-text-muted);
    opacity: .7;
  }

  /* Preview (shown after file is selected) */
  .mr-upload__preview {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: center;
    gap: .75rem;
    padding: .5rem;
  }

  .mr-upload--has-image .mr-upload__preview { display: flex; }
  .mr-upload--has-image .mr-upload__placeholder { display: none; }

  .mr-upload__preview-img {
    max-height: 180px;
    border-radius: var(--mr-radius-sm);
    object-fit: contain;
  }

  .mr-upload__remove-btn {
    background: var(--mr-surface-alt);
    color: var(--mr-text-muted);
    border: 1px solid var(--mr-border);
    border-radius: 999px;
    padding: .35rem 1rem;
    font-size: .75rem;
    font-family: var(--mr-font-body);
    transition: color .2s, border-color .2s;
  }

  .mr-upload__remove-btn:hover {
    color: var(--mr-danger);
    border-color: var(--mr-danger);
  }

  /* ==============================================
     STYLE PRESETS
     ============================================== */
  .mr-styles {
    margin-top: 1.5rem;
    border: none;
  }

  .mr-styles__grid {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    list-style: none;
  }

  .mr-style {
    position: relative;
    list-style: none;
  }

  /* Hide native radio */
  .mr-style__radio {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .mr-style__label {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .5rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--mr-border);
    background: var(--mr-surface-alt);
    font-size: .8rem;
    font-family: var(--mr-font-body);
    color: var(--mr-text-muted);
    cursor: pointer;
    transition: all .2s;
    user-select: none;
    text-decoration: none;
  }

  .mr-style__label:hover {
    border-color: var(--mr-accent);
    color: var(--mr-text);
  }

  .mr-style__radio:checked + .mr-style__label {
    background: var(--mr-accent);
    border-color: var(--mr-accent);
    color: #fff;
    box-shadow: 0 0 14px var(--mr-accent-glow);
  }

  .mr-style__radio:focus-visible + .mr-style__label {
    outline: 2px solid var(--mr-accent);
    outline-offset: 2px;
  }

  .mr-style__radio:disabled + .mr-style__label {
    opacity: .4;
    pointer-events: none;
  }

  .mr-style__icon {
    font-size: 1rem;
    line-height: 1;
  }

  /* ==============================================
     PROMPT TEXTAREA
     ============================================== */
  .mr-prompt {
    margin-top: 1.5rem;
  }

  .mr-prompt__label {
    display: block;
    font-size: .8rem;
    color: var(--mr-text-muted);
    margin-bottom: .4rem;
    font-family: var(--mr-font-body);
  }

  .mr-prompt__textarea {
    width: 100%;
    min-height: 80px;
    background: var(--mr-surface-alt);
    border: 1px solid var(--mr-border);
    border-radius: var(--mr-radius-sm);
    padding: .75rem;
    font-family: var(--mr-font-body);
    font-size: .85rem;
    color: var(--mr-text);
    resize: vertical;
    transition: border-color .2s;
  }

  .mr-prompt__textarea::placeholder {
    color: var(--mr-text-muted);
    opacity: .6;
  }

  .mr-prompt__textarea:focus {
    outline: none;
    border-color: var(--mr-accent);
  }

  .mr-prompt__textarea:disabled {
    opacity: .4;
  }

  /* ==============================================
     RENDER BUTTON
     ============================================== */
  .mr-render-btn {
    margin-top: 1.5rem;
    width: 100%;
    padding: .9rem 1.4rem;
    border: none;
    border-radius: var(--mr-radius-md);
    background: var(--mr-accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    font-family: var(--mr-font-body);
    letter-spacing: .02em;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    box-shadow: 0 4px 20px var(--mr-accent-glow);
    text-decoration: none;
  }

  .mr-render-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px var(--mr-accent-glow);
    color: #fff;
  }

  .mr-render-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .mr-render-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  /* ==============================================
     VALIDATION MESSAGE
     ============================================== */
  .mr-validation {
    margin-top: .75rem;
    font-size: .8rem;
    min-height: 1.2em;
    color: var(--mr-danger);
    font-family: var(--mr-font-body);
  }

  /* ==============================================
     RESULT AREA
     ============================================== */
  .mr-result {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    min-height: 420px;
  }

  .mr-result__placeholder {
    text-align: center;
    color: var(--mr-text-muted);
    font-size: .85rem;
  }

  .mr-result__placeholder-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto .75rem auto;
    opacity: .35;
    color: var(--mr-text-muted);
  }

  /* Loading spinner */
  .mr-result__loader {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .mr-result__loader--active {
    display: flex;
  }

  .mr-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--mr-border);
    border-top-color: var(--mr-accent);
    border-radius: 50%;
    animation: mrSpin .8s linear infinite;
  }

  @keyframes mrSpin {
    to { transform: rotate(360deg); }
  }

  .mr-result__loader-text {
    font-size: .85rem;
    color: var(--mr-text-muted);
    animation: mrPulse 1.5s ease-in-out infinite;
  }

  @keyframes mrPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .4; }
  }

  /* Generated image */
  .mr-result__image-wrap {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .mr-result__image-wrap--visible {
    display: flex;
  }

  .mr-result__image {
    width: 100%;
    max-height: 380px;
    object-fit: contain;
    border-radius: var(--mr-radius-md);
    box-shadow: 0 4px 24px rgba(0, 0, 0, .4);
  }

  .mr-result__meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .75rem;
    font-size: .75rem;
    color: var(--mr-text-muted);
    font-family: var(--mr-font-mono);
  }

  .mr-result__badge {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    padding: .25rem .7rem;
    border-radius: 999px;
    background: rgba(52, 211, 153, .12);
    color: var(--mr-success);
    font-size: .7rem;
  }

  .mr-result__download-btn {
    padding: .45rem 1rem;
    border: 1px solid var(--mr-border);
    border-radius: 999px;
    background: transparent;
    color: var(--mr-text-muted);
    font-size: .75rem;
    font-family: var(--mr-font-mono);
    transition: border-color .2s, color .2s;
    text-decoration: none;
  }

  .mr-result__download-btn:hover {
    border-color: var(--mr-accent);
    color: var(--mr-accent);
  }

  /* Error state */
  .mr-result__error {
    display: none;
    text-align: center;
    color: var(--mr-danger);
    font-size: .85rem;
    padding: 1rem;
  }

  .mr-result__error--visible {
    display: block;
  }

  /* ==============================================
     RESPONSIVE — stacks to single column
     ============================================== */
  @media (max-width: 720px) {
    .mrtl-render {
      padding: 1.5rem 1rem;
    }

    .mr-card {
      grid-template-columns: 1fr;
    }

    .mr-card__section--input {
      border-right: none;
      border-bottom: 1px solid var(--mr-border);
    }

    .mr-result { min-height: 300px; }
  }
</style>

<!-- =============================================
     HTML — Drop this whole block into a
     Squarespace Code Block
     ============================================= -->
<div class="mrtl-render">

  <!-- Header -->
  <div class="mr-header">
    <p class="mr-header__logo">MRTL Render</p>
    <h2 class="mr-header__title">Image-to-Image AI Tool</h2>
    <p class="mr-header__subtitle">Upload a reference sketch, choose a visual style, and let AI render a finished image.</p>
  </div>

  <!-- Two-column card -->
  <div class="mr-card">

    <!-- ——— INPUT AREA ——— -->
    <div class="mr-card__section mr-card__section--input" aria-label="Input controls">
      <p class="mr-section-label">01 &mdash; Input</p>

      <!-- Upload Zone -->
      <div class="mr-upload" id="mr-upload-zone" role="button" tabindex="0" aria-label="Upload an image by clicking or dragging a file here">
        <input
          type="file"
          accept="image/*"
          class="mr-upload__input"
          id="mr-file-input"
          aria-label="Choose image file"
        >

        <div class="mr-upload__placeholder">
          <svg class="mr-upload__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="6" y="6" width="36" height="36" rx="4"/>
            <path d="M6 34l10-10 8 8 6-6 12 12"/>
            <circle cx="18" cy="18" r="3"/>
          </svg>
          <p class="mr-upload__text">Drag &amp; drop or <strong>browse</strong></p>
          <p class="mr-upload__hint">PNG, JPG, or WebP &mdash; max 10 MB</p>
        </div>

        <div class="mr-upload__preview">
          <img src="" alt="Uploaded preview" class="mr-upload__preview-img" id="mr-preview-img">
          <button type="button" class="mr-upload__remove-btn" id="mr-remove-btn" aria-label="Remove uploaded image">Remove image</button>
        </div>
      </div>

      <!-- Style Presets -->
      <fieldset class="mr-styles" aria-label="Render style presets">
        <legend class="mr-section-label">02 &mdash; Style</legend>
        <ul class="mr-styles__grid" role="radiogroup">
          <li class="mr-style">
            <input class="mr-style__radio" type="radio" name="mr-style" id="mr-style-photoreal" value="Photorealistic">
            <label class="mr-style__label" for="mr-style-photoreal">
              <span class="mr-style__icon" aria-hidden="true">&#x1f4f7;</span> Photoreal
            </label>
          </li>
          <li class="mr-style">
            <input class="mr-style__radio" type="radio" name="mr-style" id="mr-style-concept" value="Concept Art">
            <label class="mr-style__label" for="mr-style-concept">
              <span class="mr-style__icon" aria-hidden="true">&#x1f3a8;</span> Concept Art
            </label>
          </li>
          <li class="mr-style">
            <input class="mr-style__radio" type="radio" name="mr-style" id="mr-style-lineart" value="Line Art">
            <label class="mr-style__label" for="mr-style-lineart">
              <span class="mr-style__icon" aria-hidden="true">&#x270f;&#xfe0f;</span> Line Art
            </label>
          </li>
          <li class="mr-style">
            <input class="mr-style__radio" type="radio" name="mr-style" id="mr-style-3d" value="3D Render">
            <label class="mr-style__label" for="mr-style-3d">
              <span class="mr-style__icon" aria-hidden="true">&#x1f4a0;</span> 3D Render
            </label>
          </li>
        </ul>
      </fieldset>

      <!-- Prompt -->
      <div class="mr-prompt">
        <label class="mr-prompt__label" for="mr-prompt-input">03 &mdash; Additional Instructions <span style="opacity:.5;">(optional)</span></label>
        <textarea
          class="mr-prompt__textarea"
          id="mr-prompt-input"
          placeholder="e.g. &quot;Make it look cyberpunk with neon accents&quot;"
          maxlength="500"
        ></textarea>
      </div>

      <!-- Render Button -->
      <button type="button" class="mr-render-btn" id="mr-render-btn">Render it!</button>

      <!-- Validation -->
      <p class="mr-validation" id="mr-validation" role="alert" aria-live="polite"></p>
    </div>

    <!-- ——— RESULT AREA ——— -->
    <div class="mr-card__section" aria-label="Generated result">
      <p class="mr-section-label">Result</p>

      <div class="mr-result" id="mr-result">
        <!-- Idle placeholder -->
        <div class="mr-result__placeholder" id="mr-result-placeholder">
          <svg class="mr-result__placeholder-icon" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="48" height="48" rx="8"/>
            <path d="M20 28h16M28 20v16"/>
          </svg>
          <p>Your rendered image will appear here.</p>
        </div>

        <!-- Loader -->
        <div class="mr-result__loader" id="mr-result-loader" aria-label="Generating image">
          <div class="mr-spinner" aria-hidden="true"></div>
          <p class="mr-result__loader-text">Rendering&hellip; this may take a moment</p>
        </div>

        <!-- Generated image -->
        <div class="mr-result__image-wrap" id="mr-result-image-wrap">
          <img src="" alt="AI generated result" class="mr-result__image" id="mr-result-image">
          <div class="mr-result__meta">
            <span class="mr-result__badge">&#x2714; Generated</span>
            <span id="mr-result-style-tag"></span>
            <button type="button" class="mr-result__download-btn" id="mr-download-btn" aria-label="Download generated image">Download</button>
          </div>
        </div>

        <!-- Error -->
        <p class="mr-result__error" id="mr-result-error" role="alert" aria-live="polite"></p>
      </div>
    </div>

  </div><!-- /.mr-card -->
</div><!-- /.mrtl-render -->

<!-- =============================================
     JAVASCRIPT — runs inside a closure so nothing
     leaks to the global scope
     ============================================= -->
<script>
  (() => {
    'use strict';

    // -----------------------------------------------
    // DOM REFERENCES  (all prefixed with "mr-" ids)
    // -----------------------------------------------
    const uploadZone   = document.getElementById('mr-upload-zone');
    const fileInput    = document.getElementById('mr-file-input');
    const previewImg   = document.getElementById('mr-preview-img');
    const removeBtn    = document.getElementById('mr-remove-btn');
    const promptInput  = document.getElementById('mr-prompt-input');
    const renderBtn    = document.getElementById('mr-render-btn');
    const validationEl = document.getElementById('mr-validation');

    const resultPlaceholder = document.getElementById('mr-result-placeholder');
    const resultLoader      = document.getElementById('mr-result-loader');
    const resultImageWrap   = document.getElementById('mr-result-image-wrap');
    const resultImage       = document.getElementById('mr-result-image');
    const resultStyleTag    = document.getElementById('mr-result-style-tag');
    const resultError       = document.getElementById('mr-result-error');
    const downloadBtn       = document.getElementById('mr-download-btn');

    const styleRadios = document.querySelectorAll('.mr-style__radio');

    // -----------------------------------------------
    // APPLICATION STATE
    // -----------------------------------------------
    let imageBase64   = '';   // Base64 data URI of the uploaded image
    let imageMime     = '';   // MIME type  (e.g. "image/png")
    let selectedStyle = '';   // Currently selected render style value
    let isLoading     = false;

    // -----------------------------------------------
    // FILE HANDLING  (FileReader API)
    // -----------------------------------------------

    /** Read a File, show a preview, store the base64 string. */
    const handleFile = (file) => {
      if (!file.type.startsWith('image/')) {
        showValidation('Please upload a valid image file.');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showValidation('Image must be smaller than 10 MB.');
        return;
      }

      const reader = new FileReader();

      reader.addEventListener('load', () => {
        imageBase64 = reader.result;
        imageMime   = file.type;
        previewImg.src = imageBase64;
        uploadZone.classList.add('mr-upload--has-image');
        clearValidation();
      });

      reader.addEventListener('error', () => {
        showValidation('Failed to read the file. Please try again.');
      });

      reader.readAsDataURL(file);
    };

    // Click / change on native file input
    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (file) handleFile(file);
    });

    // Drag-and-drop
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('mr-upload--dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('mr-upload--dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('mr-upload--dragover');
      const file = e.dataTransfer && e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    // Remove image
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      imageBase64 = '';
      imageMime   = '';
      previewImg.src = '';
      fileInput.value = '';
      uploadZone.classList.remove('mr-upload--has-image');
    });

    // -----------------------------------------------
    // STYLE PRESET SELECTION
    // -----------------------------------------------
    styleRadios.forEach((radio) => {
      radio.addEventListener('change', () => {
        selectedStyle = radio.value;
        clearValidation();
      });
    });

    // -----------------------------------------------
    // VALIDATION HELPERS
    // -----------------------------------------------
    const showValidation = (msg) => { validationEl.textContent = msg; };
    const clearValidation = ()   => { validationEl.textContent = ''; };

    // -----------------------------------------------
    // UI STATE  (loading toggle)
    // -----------------------------------------------
    const setLoading = (loading) => {
      isLoading = loading;
      renderBtn.disabled   = loading;
      promptInput.disabled = loading;
      fileInput.disabled   = loading;
      removeBtn.disabled   = loading;
      styleRadios.forEach((r) => { r.disabled = loading; });

      renderBtn.textContent = loading ? 'Rendering\u2026' : 'Render it!';

      resultPlaceholder.style.display = 'none';
      resultLoader.classList.toggle('mr-result__loader--active', loading);
      resultError.classList.remove('mr-result__error--visible');

      if (loading) {
        resultImageWrap.classList.remove('mr-result__image-wrap--visible');
      }
    };

    // -----------------------------------------------
    // HELPER — promise-wrapped setTimeout
    // -----------------------------------------------
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // -----------------------------------------------
    // API INTEGRATION  (Mock — heavily commented)
    //
    // HOW TO SWAP IN YOUR REAL BACKEND:
    //   1. Replace the placeholder URL with your
    //      actual API endpoint.
    //   2. Adjust the JSON payload fields to match
    //      your API's expected schema.
    //   3. Remove the `delay()` call and the mock
    //      image fallback — use the real response.
    //   4. If your API returns base64, set
    //      resultImage.src to
    //        `data:<mime>;base64,<data>`
    //      If it returns a URL, set the src directly.
    // -----------------------------------------------
    const generateImage = async () => {
      // --- Input validation ---
      if (!imageBase64) {
        showValidation('Please upload a reference image first.');
        return;
      }
      if (!selectedStyle) {
        showValidation('Please select a render style.');
        return;
      }

      clearValidation();
      setLoading(true);

      // --- Build the combined prompt ---
      const userPrompt = promptInput.value.trim();
      const combinedPrompt = userPrompt
        ? `${selectedStyle} style. ${userPrompt}`
        : `${selectedStyle} style.`;

      // --- Build the JSON payload ---
      // Mirrors common Image-to-Image API conventions.
      const payload = {
        // Full base64 data URI of the uploaded image.
        // Some APIs want the raw string without the
        // "data:image/...;base64," prefix — strip it
        // with: imageBase64.split(',')[1]
        image_base64: imageBase64,

        // Combined text prompt (style + user input).
        prompt: combinedPrompt,

        // MIME type of the uploaded image.
        mime_type: imageMime,
      };

      try {
        // ================================================
        // FETCH REQUEST — REPLACE WITH YOUR REAL API
        // ================================================
        //
        // const response = await fetch(
        //   'https://api.yourbackend.com/v1/generate-image',
        //   {
        //     method: 'POST',
        //     headers: {
        //       'Content-Type': 'application/json',
        //       // 'Authorization': 'Bearer YOUR_API_KEY',
        //     },
        //     body: JSON.stringify(payload),
        //   }
        // );
        //
        // if (!response.ok) {
        //   throw new Error(`API error: ${response.status}`);
        // }
        //
        // const data = await response.json();
        // const generatedImageUrl = data.image_url;
        // ================================================

        // --- MOCK: 3-second simulated network delay ---
        await delay(3000);

        // --- MOCK: placeholder image to simulate success ---
        const seed = Math.floor(Math.random() * 10000);
        const generatedImageUrl =
          `https://picsum.photos/seed/${seed}/720/480`;

        // --- Show the result ---
        resultImage.src = generatedImageUrl;
        resultImage.alt = `AI generated image in ${selectedStyle} style`;
        resultStyleTag.textContent = selectedStyle;
        resultImageWrap.classList.add('mr-result__image-wrap--visible');

      } catch (err) {
        resultError.textContent =
          `Something went wrong: ${err.message || 'Unknown error'}. Please try again.`;
        resultError.classList.add('mr-result__error--visible');
      } finally {
        setLoading(false);
      }
    };

    // -----------------------------------------------
    // EVENT: Render button
    // -----------------------------------------------
    renderBtn.addEventListener('click', () => {
      if (!isLoading) generateImage();
    });

    // -----------------------------------------------
    // EVENT: Download button
    // -----------------------------------------------
    downloadBtn.addEventListener('click', () => {
      const src = resultImage.src;
      if (!src) return;
      const link = document.createElement('a');
      link.href = src;
      link.download = `mrtl-render-${Date.now()}.png`;
      link.rel = 'noopener';
      document.body.appendChild(link);
      link.click();
      link.remove();
    });
  })();
